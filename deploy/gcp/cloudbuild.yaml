substitutions:
  _IMAGE: part21

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --file=deploy/gcp/Dockerfile
      - --tag=${_IMAGE}
      - --cache-from=${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args: ["push", "${_IMAGE}"]

images:
  - ${_IMAGE}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
